services:
  - type: web
    name: hireai-backend
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 4"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hireai-postgres
          property: connectionString
      - key: STORAGE_PROVIDER
        value: local
      - key: SMTP_SERVER
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SENDER
        sync: false
      - key: SMTP_PASSWORD
        sync: false

databases:
  - name: hireai-postgres
    plan: free
